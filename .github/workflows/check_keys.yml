name: Check VLESS Keys

on:
  schedule:
    # Смещено от начала часа: GitHub задерживает или пропускает запуски около :00.
    #
    # Раньше здесь было '17,47 * * * *' — 48 запусков в сутки. 23.10.2026 GitHub
    # посчитал такой объём злоупотреблением для форка и молча выключил все
    # workflow в репозитории ("Workflows are not currently being run on this fork
    # due to the scale of GitHub Actions usage"), поэтому CI встал на две недели.
    # Каждый запуск ещё и коммитит, а коммит в main тянет сборку Pages — то есть
    # на один цикл приходится два прогона. Держим 8 циклов в сутки: свежесть
    # подписки всё равно ограничена тем, что GitHub и раньше троттлил расписание
    # до одного запуска в ~5-6 часов.
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: check-keys
  cancel-in-progress: false

permissions:
  contents: write

env:
  XRAY_VERSION: v26.3.27

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ env.XRAY_VERSION }}-linux-64

      - name: Install Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q -o xray.zip xray
          chmod +x xray
          rm xray.zip

      - name: Xray version
        run: ./xray version | head -1

      - name: Run checker
        env:
          XRAY_BIN: ./xray
        run: python build.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/keys.json good.txt top100.txt top50.txt top15.txt history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update checked keys [skip ci]"
          git pull --rebase --autostash origin main
          git push
